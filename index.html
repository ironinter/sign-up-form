<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @font-face {
            font-family: Norse;
            src: url(fonts/Norse-Bold.woff2) format(woff2);
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <aside>
        <div class="dark-bg-container">
            <img src="images/odin-lined.png" alt="photu">
            <div class="odin-text">ODIN</div>
        </div>
    </aside>


    <main>
        <div class="para-form">
            <p>
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
            <br>Sign up <span style="font-style:italic;">now</span> to get started.
            <br><br>You <span style="font-style: italic;">know</span> you want to.
            </p>

            <form action="" method="get" id="main-form">
                <h4>Let's do this!</h4>

                <fieldset>
                    <section>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name">
                    </section>
                    <section>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name">
                    </section>
                </fieldset>

                <fieldset>
                    <section>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email">
                    </section>
                    <section>
                        <label for="tel">PHONE NUMBER</label>
                        <input type="tel" id="tel">
                    </section>
                </fieldset>

                <fieldset>
                    <section>
                        <label for="pswd">PASSWORD</label>
                        <input type="password" id="pswd">
                    </section>
                    <section>
                        <label for="confirm-pswd">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-pswd">
                    </section>
                </fieldset>

            </form>
        </div>
    </main>
</body>
</html>
